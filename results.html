<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RxReveal — Result</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/screens/results.css" />
</head>
<body>
<div class="app">
  <div class="card">
    <div class="topbar">
      <button class="btn-icon" id="results-back" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="topbar-title">Check result</span>
      <span style="width:40px"></span>
    </div>

    <!-- LOADING -->
    <div class="results-state" id="state-loading" aria-live="polite" hidden>
      <div class="spinner"></div>
      <p class="hint-sm">Checking interactions…</p>
    </div>

    <!-- ERROR -->
    <div class="results-state" id="state-error" aria-live="polite" hidden>
      <div class="error-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      </div>
      <p class="error-title">Couldn't get the result</p>
      <p class="hint-sm">Check that the backend is running, then try again.</p>
      <button class="btn btn-primary btn-large" id="retry-btn">Try again</button>
    </div>

    <!-- RESULT -->
    <div id="state-result" hidden>
      <div class="pair-row">
        <div class="pair-chip" id="result-drug-a">—</div>
        <span class="pair-plus">+</span>
        <div class="pair-chip" id="result-drug-b">—</div>
      </div>

      <div class="risk-badge" id="risk-badge" tabindex="-1">
        <div class="risk-label" id="risk-label">—</div>
        <div class="risk-desc" id="risk-desc"></div>
      </div>

      <h2 class="section-title" id="effects-title">Possible effects</h2>
      <div class="effects-list" id="effects-list"></div>

      <h2 class="section-title" id="molecules-title">How they interact</h2>
      <div class="molecule-grid" id="molecules"></div>

      <button class="btn btn-primary btn-large" id="new-check-btn">
        Start a new check
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>

<script type="module" src="js/screens/results.js"></script>
</body>
</html>
