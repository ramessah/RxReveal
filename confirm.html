<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RxReveal — Confirm match</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/screens/confirm.css" />
</head>
<body>

<div class="app">
  <div class="card">
    <div class="topbar">
      <button class="btn-icon" id="confirm-back" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <span class="topbar-title">Confirm match</span>
      <span style="width:40px"></span>
    </div>

    <h2>Did we get it right?</h2>
    <p class="subtitle-sm" id="confirm-source-note">Here's what we understood.</p>

    <div class="top-match">
      <div class="top-match-name" id="top-match-name">—</div>
      <div class="top-match-sub" id="top-match-sub"></div>
      <button class="btn btn-primary btn-large" id="confirm-btn">
        Confirm
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </div>

    <p class="alt-heading">Not quite right? Choose another match</p>
    <div class="alt-list" id="alt-list"></div>

    <a class="fallback-link centered" id="confirm-fallback">None of these — let me type it</a>
  </div>
</div>

<script type="module" src="js/screens/confirm.js"></script>
</body>
</html>
